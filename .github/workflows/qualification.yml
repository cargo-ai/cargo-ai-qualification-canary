name: Cargo AI Qualification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qualify:
    name: Exact package compatibility
    uses: cargo-ai/cargo-ai/.github/workflows/package-qualification.yml@cebc0fe9822cf41a1e4aee87d25f2e518f61077b
    with:
      package_repository: cargo-ai/cargo-ai-qualification-canary
      package_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      cargo_ai_sha: cebc0fe9822cf41a1e4aee87d25f2e518f61077b
      declaration_path: cargo-ai-qualification.toml
      platforms_json: '["ubuntu-latest","macos-latest","windows-latest"]'
      emit_summary: true
